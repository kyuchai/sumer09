services:
  - type: web
    name: plantopia-final
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plantopia-db
          property: connectionString
      - key: CWA_API_KEY
        sync: false

databases:
  - name: plantopia-db
    region: singapore
    plan: free
